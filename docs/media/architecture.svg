<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B66"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8871B"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE6E2"/>
    </pattern>
  </defs>

  <rect width="1600" height="940" fill="#FFFFFF"/>
  <rect width="1600" height="940" fill="url(#dots)"/>

  <!-- Title -->
  <text x="60" y="66" font-size="32" font-weight="700" fill="#10241F">DuitDuit architecture</text>
  <text x="60" y="98" font-size="17" fill="#5A6B66">Agents propose. People decide. Every step is evidence. No raw personal data ever reaches an AI model.</text>

  <!-- Column headings -->
  <g font-size="13" font-weight="700" fill="#086759" letter-spacing="0.4">
    <text x="60" y="150">1  CAPTURE</text>
    <text x="330" y="150">2  PROTECT</text>
    <text x="640" y="150">3  AGENTS PROPOSE</text>
    <text x="990" y="150">4  PEOPLE DECIDE</text>
    <text x="1310" y="150">5  RESULTS</text>
  </g>

  <!-- 1 Capture -->
  <g font-size="15" fill="#10241F">
    <g>
      <rect x="60" y="170" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
      <text x="80" y="201">Gmail and email</text>
    </g>
    <g>
      <rect x="60" y="232" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
      <text x="80" y="263">Telegram capture bot</text>
    </g>
    <g>
      <rect x="60" y="294" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
      <text x="80" y="325">Uploads, CSV, OCR</text>
    </g>
    <g>
      <rect x="60" y="356" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
      <text x="80" y="387">Bank statements</text>
    </g>
    <g>
      <rect x="60" y="418" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
      <text x="80" y="449">LHDN e-invoices</text>
    </g>
    <g>
      <rect x="60" y="480" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
      <text x="80" y="511">Typed or spoken requests</text>
    </g>
  </g>

  <!-- 2 Protect: privacy boundary -->
  <rect x="330" y="170" width="250" height="360" rx="16" fill="#E8F5F2" stroke="#0E9F8E" stroke-width="2"/>
  <text x="352" y="200" font-size="16" font-weight="700" fill="#086759">Privacy boundary</text>
  <g font-size="14" fill="#10241F">
    <rect x="350" y="216" width="210" height="52" rx="9" fill="#FFFFFF" stroke="#A9D9CF"/>
    <text x="366" y="238" font-weight="600">Detect personal data</text>
    <text x="366" y="257" font-size="12.5" fill="#5A6B66">NRIC, phone, bank, names</text>

    <rect x="350" y="278" width="210" height="52" rx="9" fill="#FFFFFF" stroke="#A9D9CF"/>
    <text x="366" y="300" font-weight="600">Tokenize</text>
    <text x="366" y="319" font-size="12.5" fill="#5A6B66">PERSON_a1b2… · amount bands</text>

    <rect x="350" y="340" width="210" height="52" rx="9" fill="#FFFFFF" stroke="#A9D9CF"/>
    <text x="366" y="362" font-weight="600">Encrypted vault</text>
    <text x="366" y="381" font-size="12.5" fill="#5A6B66">AES-256-GCM, rotating keys</text>

    <rect x="350" y="402" width="210" height="52" rx="9" fill="#FFF4F1" stroke="#E6A493"/>
    <text x="366" y="424" font-weight="600">Injection guard</text>
    <text x="366" y="443" font-size="12.5" fill="#5A6B66">instructions quarantined as data</text>

    <text x="352" y="484" font-size="12.5" fill="#086759">Role-aware masks on the way out:</text>
    <text x="352" y="503" font-size="12.5" fill="#086759">staff see RM2.5K–5K, not RM4,500</text>
  </g>

  <!-- Arrows capture -> protect -->
  <g stroke="#5A6B66" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M280,195 C305,195 305,300 328,330"/>
    <path d="M280,257 C305,257 305,320 328,338"/>
    <path d="M280,319 L328,346"/>
    <path d="M280,381 L328,354"/>
    <path d="M280,443 C305,443 305,380 328,362"/>
    <path d="M280,505 C305,505 305,400 328,370"/>
  </g>

  <!-- 3 Agents -->
  <rect x="640" y="170" width="300" height="360" rx="16" fill="#FFFFFF" stroke="#C9D6D1"/>
  <rect x="660" y="188" width="260" height="46" rx="10" fill="#10241F"/>
  <text x="680" y="210" font-size="15" font-weight="700" fill="#FFFFFF">Supervisor</text>
  <text x="680" y="227" font-size="12" fill="#A7B8B2">routes the goal, in EN, BM or 中文</text>
  <g font-size="13.5" fill="#10241F">
    <rect x="660" y="246" width="125" height="36" rx="8" fill="#F4F8F6" stroke="#C9D6D1"/><text x="672" y="269">Cash flow</text>
    <rect x="795" y="246" width="125" height="36" rx="8" fill="#F4F8F6" stroke="#C9D6D1"/><text x="807" y="269">Collections</text>
    <rect x="660" y="290" width="125" height="36" rx="8" fill="#F4F8F6" stroke="#C9D6D1"/><text x="672" y="313">Financing</text>
    <rect x="795" y="290" width="125" height="36" rx="8" fill="#F4F8F6" stroke="#C9D6D1"/><text x="807" y="313">HR and payroll</text>
    <rect x="660" y="334" width="125" height="36" rx="8" fill="#F4F8F6" stroke="#C9D6D1"/><text x="672" y="357">Payables</text>
    <rect x="795" y="334" width="125" height="36" rx="8" fill="#F4F8F6" stroke="#C9D6D1"/><text x="807" y="357">Sales</text>
    <rect x="660" y="378" width="125" height="36" rx="8" fill="#F4F8F6" stroke="#C9D6D1"/><text x="672" y="401">Compliance</text>
    <rect x="795" y="378" width="125" height="36" rx="8" fill="#FBF3DC" stroke="#E0B23A"/><text x="807" y="401">Checker agent</text>
  </g>
  <text x="660" y="440" font-size="12.5" fill="#5A6B66">Code computes: forecast, matching,</text>
  <text x="660" y="458" font-size="12.5" fill="#5A6B66">reconciliation, eligibility, anomalies.</text>
  <rect x="660" y="472" width="260" height="42" rx="9" fill="#F4F0FB" stroke="#B9A7DE"/>
  <text x="676" y="490" font-size="13" font-weight="600" fill="#10241F">Morpheus / Gemini narrate</text>
  <text x="676" y="506" font-size="12" fill="#5A6B66">tokens only · cited · offline fallback</text>

  <!-- protect -> agents -->
  <path d="M580,350 L638,350" stroke="#0E9F8E" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
  <text x="586" y="340" font-size="11.5" fill="#086759">tokens</text>

  <!-- 4 People decide -->
  <rect x="990" y="170" width="270" height="360" rx="16" fill="#FFFFFF" stroke="#C9D6D1"/>
  <text x="1010" y="200" font-size="16" font-weight="700" fill="#10241F">Review inbox</text>
  <text x="1010" y="219" font-size="12.5" fill="#5A6B66">every proposal waits for a person</text>
  <g font-size="13.5">
    <rect x="1010" y="234" width="230" height="44" rx="9" fill="#EEF6F3" stroke="#BFDCD3"/>
    <text x="1024" y="253" font-weight="700" fill="#086759">L1</text><text x="1050" y="253" fill="#10241F">Read and draft</text>
    <text x="1050" y="270" font-size="12" fill="#5A6B66">within the person's role</text>

    <rect x="1010" y="286" width="230" height="44" rx="9" fill="#FBF3DC" stroke="#E7CB7C"/>
    <text x="1024" y="305" font-weight="700" fill="#9A6E0B">L2</text><text x="1050" y="305" fill="#10241F">Anything external</text>
    <text x="1050" y="322" font-size="12" fill="#5A6B66">owner + authenticator code</text>

    <rect x="1010" y="338" width="230" height="44" rx="9" fill="#FDECE8" stroke="#E6A493"/>
    <text x="1024" y="357" font-weight="700" fill="#B3412A">L3</text><text x="1050" y="357" fill="#10241F">Money</text>
    <text x="1050" y="374" font-size="12" fill="#5A6B66">maker + a different checker, codes</text>
  </g>
  <rect x="1010" y="398" width="230" height="56" rx="10" fill="#10241F"/>
  <text x="1026" y="421" font-size="14" font-weight="700" fill="#FFFFFF">Simulated bank</text>
  <text x="1026" y="441" font-size="12" fill="#E0B23A">pays once · SIM-… · no real money</text>
  <text x="1010" y="478" font-size="12.5" fill="#5A6B66">Kill switch per agent. Autonomy is</text>
  <text x="1010" y="496" font-size="12.5" fill="#5A6B66">earned from 30 human decisions.</text>
  <path d="M1125,382 L1125,396" stroke="#B3412A" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- agents -> inbox -->
  <path d="M940,350 L988,350" stroke="#E0B23A" stroke-width="2.4" fill="none" marker-end="url(#arrowGold)"/>
  <text x="944" y="340" font-size="11.5" fill="#9A6E0B">proposals</text>

  <!-- 5 Results -->
  <g font-size="14" fill="#10241F">
    <rect x="1310" y="170" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
    <text x="1326" y="195" font-weight="700">Owner and team</text>
    <text x="1326" y="214" font-size="12.5" fill="#5A6B66">Today, cash, reconciliation,</text>
    <text x="1326" y="231" font-size="12.5" fill="#5A6B66">Ask DuitDuit · EN / BM / 中文</text>

    <rect x="1310" y="260" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
    <text x="1326" y="285" font-weight="700">Lender</text>
    <text x="1326" y="304" font-size="12.5" fill="#5A6B66">Financing Passport: bands,</text>
    <text x="1326" y="321" font-size="12.5" fill="#5A6B66">consented, verifiable link</text>

    <rect x="1310" y="350" width="230" height="78" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
    <text x="1326" y="375" font-weight="700">Auditor</text>
    <text x="1326" y="394" font-size="12.5" fill="#5A6B66">Audit pack, payroll lines</text>
    <text x="1326" y="411" font-size="12.5" fill="#5A6B66">withheld</text>

    <rect x="1310" y="440" width="230" height="90" rx="10" fill="#FFFFFF" stroke="#C9D6D1"/>
    <text x="1326" y="465" font-weight="700">Notices and AI tools</text>
    <text x="1326" y="484" font-size="12.5" fill="#5A6B66">Slack, Telegram, email briefing;</text>
    <text x="1326" y="501" font-size="12.5" fill="#5A6B66">MCP: read-only, scoped keys</text>
  </g>
  <g stroke="#5A6B66" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M1260,300 C1285,300 1285,209 1308,209"/>
    <path d="M1260,320 L1308,299"/>
    <path d="M1260,340 L1308,389"/>
    <path d="M1260,360 C1285,360 1285,485 1308,485"/>
  </g>

  <!-- Bottom: trust foundation -->
  <rect x="60" y="572" width="1480" height="96" rx="16" fill="#10241F"/>
  <text x="90" y="608" font-size="18" font-weight="700" fill="#FFFFFF">Tamper-evident audit chain</text>
  <text x="90" y="634" font-size="14" fill="#A7B8B2">Every proposal, decision, disclosure, payment and blocked attack is a hash-linked event:</text>
  <text x="90" y="654" font-size="14" fill="#A7B8B2">ids and kinds only, never people's words. Anchored outside the database every day.</text>
  <g font-size="13" fill="#E0B23A" font-family="Consolas, 'Courier New', monospace">
    <rect x="1010" y="596" width="150" height="50" rx="8" fill="none" stroke="#3B5650"/>
    <text x="1024" y="618">#8f2c…</text><text x="1024" y="636" fill="#7E918B">proposed</text>
    <rect x="1190" y="596" width="150" height="50" rx="8" fill="none" stroke="#3B5650"/>
    <text x="1204" y="618">#a41e…</text><text x="1204" y="636" fill="#7E918B">approved ×2</text>
    <rect x="1370" y="596" width="150" height="50" rx="8" fill="none" stroke="#3B5650"/>
    <text x="1384" y="618">#c07b…</text><text x="1384" y="636" fill="#7E918B">paid · SIM</text>
  </g>
  <g stroke="#E0B23A" stroke-width="1.6" marker-end="url(#arrowGold)">
    <path d="M1160,621 L1188,621"/>
    <path d="M1340,621 L1368,621"/>
  </g>
  <g stroke="#C9D6D1" stroke-width="1.4" stroke-dasharray="4 5">
    <path d="M455,530 L455,570"/>
    <path d="M790,530 L790,570"/>
    <path d="M1125,530 L1125,570"/>
  </g>

  <!-- Stack strip -->
  <rect x="60" y="690" width="1480" height="64" rx="14" fill="#F4F8F6" stroke="#DCE6E2"/>
  <g font-size="14" fill="#10241F">
    <text x="90" y="728"><tspan font-weight="700">Web</tspan>  React 19 · Vite · plain CSS · strict CSP</text>
    <text x="480" y="728"><tspan font-weight="700">API</tspan>  FastAPI · Python 3.12 · Docker</text>
    <text x="830" y="728"><tspan font-weight="700">Data</tspan>  Postgres 17 · pgvector · forced row-level security per company</text>
  </g>

  <!-- Proof strip -->
  <g font-size="15" fill="#10241F">
    <text x="60" y="806" font-weight="700">Proven offline, every commit</text>
    <text x="60" y="834" fill="#5A6B66">57 / 57 evaluation tasks (27 functional, 30 adversarial: induced transfer, data extraction, privilege escalation, prompt injection)</text>
    <text x="60" y="858" fill="#5A6B66">845 backend tests · OWASP ZAP 0 failures · WCAG 2.1 AA 0 violations</text>
  </g>
  <text x="1540" y="900" font-size="12.5" fill="#7E918B" text-anchor="end">All demo figures are synthetic.</text>
</svg>
