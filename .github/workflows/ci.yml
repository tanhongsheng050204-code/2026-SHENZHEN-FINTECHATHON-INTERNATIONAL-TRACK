name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres-rls:
    name: PostgreSQL (migrations and Plan 2/3 RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: local-review-only-finbrain-pg
          POSTGRES_DB: finbrain_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finbrain_review"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Apply all real migrations to the disposable database
        env:
          FINBRAIN_REVIEW_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run python -m scripts.check_plan23_migrations
      - name: Exercise import, tenant, payroll and settings database policies
        env:
          FINBRAIN_REVIEW_POSTGRES_URL: postgresql+psycopg://postgres:local-review-only-finbrain-pg@127.0.0.1:5432/finbrain_review
        run: uv run pytest tests/test_plan23_postgres.py -q
      - name: Validate the deployment schema and database privileges
        env:
          DATABASE_URL: postgresql+psycopg://postgres:local-review-only-finbrain-pg@127.0.0.1:5432/finbrain_review
        run: uv run python -m scripts.check_supabase

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest, SQLite — no secrets required)
        run: uv run pytest -q

      - name: Evaluation harness (functional and adversarial tasks, offline)
        run: uv run python -m eval.run ../output

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: output/eval-report.*

  supply-chain:
    name: Supply chain (dependency audits, secret scan, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: |
          uv export --format requirements-txt --no-hashes --no-dev -q > ../requirements-audit.txt
          uvx pip-audit -r ../requirements-audit.txt --disable-pip --no-deps

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend dependency audit (npm audit, high and above)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Secret scan of the full history (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Web hardening (security headers, no third-party loads)
        run: node scripts/check-web-hardening.mjs
      - name: Microphone permission policy regressions
        run: node --test scripts/permissions-policy.test.mjs
